<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Onda Workstation, produção musical no navegador sem conta.">
<meta name="theme-color" content="#353b40"><title>Onda Workstation</title>
<link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="symbols">
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l2-6 4 13 4-15 3 8h4"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z" fill="currentColor" stroke-width="1.4"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14" stroke-width="2.5"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></symbol>
<symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
<symbol id="i-loop" viewBox="0 0 24 24"><path d="m18 2 3 4-3 4M21 6H7a4 4 0 0 0-4 4v2m3 10-3-4 3-4m-3 4h14a4 4 0 0 0 4-4v-2"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M6 3h11l4 4v14H3V3zm2 0v7h8V3M7 21v-7h10v7"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V3M7 8l5-5 5 5M4 14v7h16v-7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16m6-16v16"/></symbol>
<symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16M7 4v9m10-9v9"/></symbol>
<symbol id="i-mix" viewBox="0 0 24 24"><path d="M5 4v16m7-16v16m7-16v16M2 9h6m1 6h6m1-7h6"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 20l6-7 5 3 7-11"/><circle cx="9" cy="13" r="1.5"/><circle cx="14" cy="16" r="1.5"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 4 3 9l5 5M3 9h11a6 6 0 0 1 0 12"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-drum" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="9" ry="4"/><path d="M3 7v9c0 2 4 4 9 4s9-2 9-4V7M6 10l5 9m7-9-5 9"/></symbol>
<symbol id="i-synth" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 13h3l2-5 3 8 2-3h2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16m-11 0V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3m-4 0h8"/></symbol>
<symbol id="i-rack" viewBox="0 0 24 24"><path d="M4 5h2m-2 7h2m-2 7h2M9 4h11v3H9zm0 7h11v3H9zm0 7h11v3H9z"/></symbol><symbol id="i-float" viewBox="0 0 24 24"><path d="M6 8H3v13h13v-3M9 3h12v12H9z"/></symbol><symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 20l4-1 12-12-4-4L4 15zM13 6l4 4"/></symbol></svg>
<header class="top">
 <span class="brand" aria-label="Onda Workstation"><span class="brandmark"><svg><use href="#i-wave"/></svg></span><span>ONDA</span></span>
 <nav class="menubar" aria-label="Menu principal">
  <button data-cmd="files">Arquivo</button><button data-cmd="edit-menu">Editar</button><button data-cmd="add-menu">Adicionar</button><button data-cmd="view-menu">Visualizar</button><button data-cmd="help">Ajuda</button>
 </nav>
 <div class="file"><input id="title" aria-label="Nome do projeto" maxlength="64"></div>
 <div class="actions"><button data-cmd="export" class="btn subtle"><svg><use href="#i-down"/></svg><span>Exportar</span></button></div>
</header>
<div class="transport">
 <div class="mode" aria-label="Modo de reprodução"><button data-mode="pattern" title="Tocar padrão">PAT</button><button data-mode="song" title="Tocar música">SONG</button></div>
 <div class="transport-buttons"><button id="play" data-cmd="play" class="ico transport-play" title="Reproduzir ou pausar (Espaço)" aria-label="Reproduzir"><svg><use href="#i-play"/></svg></button><button data-cmd="stop" class="ico" title="Parar" aria-label="Parar"><svg><use href="#i-stop"/></svg></button><button data-cmd="record" class="ico rec" title="Gravar áudio" aria-label="Gravar áudio"><svg><use href="#i-record"/></svg></button></div>
 <label class="transport-field tempo"><input id="bpm" type="number" min="40" max="250" title="Tempo do projeto" aria-label="BPM"><span>TEMPO</span></label>
 <div class="counter"><strong id="counter">01:01:00</strong><span>COMPASSO : TEMPO : TICK</span></div>
 <div id="transport-pattern" class="pattern-field"></div>
 <button data-cmd="loop" class="ico" title="Repetição" aria-label="Repetição"><svg><use href="#i-loop"/></svg></button>
 <label class="transport-field small"><span>SWING</span><input id="sw" type="number" min="0" max="65" aria-label="Swing em porcentagem"><small>%</small></label>
 <div class="master-monitor"><canvas id="meter" width="152" height="29" aria-label="Medidor de nível do master"></canvas></div>
 <nav class="tabs" aria-label="Janelas do estúdio"><button data-view="arrange" title="Playlist (F5)"><svg><use href="#i-grid"/></svg><span>Playlist</span></button><button data-cmd="rack" title="Channel Rack (F6)" aria-controls="channel-rack"><svg><use href="#i-rack"/></svg><span>Rack</span></button><button data-view="piano" title="Piano Roll (F7)"><svg><use href="#i-piano"/></svg><span>Piano</span></button><button data-view="mix" title="Mixer (F9)"><svg><use href="#i-mix"/></svg><span>Mixer</span></button><button data-view="plugins" title="Plugins"><svg><use href="#i-wave"/></svg><span>FX</span></button><button data-view="auto" title="Automação"><svg><use href="#i-trend"/></svg><span>Auto</span></button><button id="show-sounds" data-cmd="sounds" title="Biblioteca (Alt+F8)" aria-label="Biblioteca" aria-controls="browser"><svg><use href="#i-folder"/></svg><span>Sons</span></button></nav>
</div>
<div class="workspace">
<aside class="sidebar" id="browser" aria-label="Biblioteca">
 <div class="browser-title"><svg><use href="#i-folder"/></svg><h2>Browser</h2><button data-cmd="sounds" class="ico" aria-label="Fechar biblioteca"><svg><use href="#i-close"/></svg></button></div>
 <nav class="browser-tabs" aria-label="Conteúdo da biblioteca"><button data-library="sounds" aria-pressed="true">Sons</button><button data-library="project" aria-pressed="false">Projeto</button></nav>
 <div id="sound-list"></div>
 <div class="side-foot"><button data-cmd="sample" class="btn subtle wide"><svg><use href="#i-up"/></svg> Importar áudio</button><small>Biblioteca local · Onda</small></div>
</aside>
<main>
 <h1 class="sr-only" id="page-heading">Playlist</h1>
 <div class="panel" id="editor"></div>
 <section class="panel rack" id="channel-rack" aria-label="Channel Rack"><div class="window-title rack-title" id="rack-handle"><h2><svg><use href="#i-rack"/></svg> Channel Rack</h2><div class="window-buttons"><button class="ico" data-cmd="rack-float" aria-label="Desencaixar Channel Rack" title="Desencaixar Channel Rack"><svg><use href="#i-float"/></svg></button><button class="ico" data-cmd="rack" aria-label="Fechar Channel Rack"><svg><use href="#i-close"/></svg></button></div></div><div class="rack-controls"><span>16 passos por compasso</span><div class="rack-actions"><button class="ico" id="bar-down" aria-label="Compasso anterior"><svg><use href="#i-back"/></svg></button><span id="stepbar">01 / 01</span><button class="ico" id="bar-up" aria-label="Próximo compasso"><svg><use href="#i-chevron"/></svg></button></div></div><div id="steps"></div><div class="rack-footer"><button class="ico" data-cmd="add-menu" aria-label="Adicionar canal" title="Adicionar canal"><svg><use href="#i-plus"/></svg></button></div></section>
</main>
</div>
<footer><span><i></i> LOCAL<span id="save-status"> • pronto</span></span><span id="guide" class="footer-tips"></span><button data-cmd="undo" class="ico" aria-label="Desfazer" title="Desfazer (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button><button data-cmd="redo" class="ico" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button><span class="version">ONDA / 2.1</span></footer>
<aside id="studio-rec" class="studio-rec" hidden aria-label="Gravação ativa"><span class="rec-dot"></span><strong id="rec-label">Preparando</strong><span class="rec-meter"><i id="rec-meter"></i></span><span id="rec-time">00:00</span><button class="btn subtle" data-cmd="rec-stop">Parar tomada</button></aside>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<input type="file" id="project-file" accept=".onda,.json,.mid,.midi" hidden>
<input type="file" id="audio-file" accept="audio/*,.flac,.wav,.mp3,.ogg,.m4a,.aif,.aiff,.webm" hidden>
<script type="module" src="./app.mjs"></script>
</body>
</html>
